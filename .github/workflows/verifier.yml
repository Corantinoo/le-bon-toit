# Construit le site et le vérifie dans un vrai navigateur à chaque pull request et à chaque mise à jour de main.
name: Vérifier le site
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python build.py
      - run: python tests/verifier.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures
          path: tests/captures/
